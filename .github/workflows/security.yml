name: Credential safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install scanner
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Check committed configuration
        run: bash tests/check_credentials.sh

      - name: Check shell script
        run: shellcheck tests/check_credentials.sh
